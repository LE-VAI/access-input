name: CI

# The test suite is the acceptance gate for this package. It runs on every
# push and PR across the Node versions the package claims to support
# (engines: >=18), so a breaking change is caught before it reaches npm.
#
# No install step is needed — the package has zero dependencies and the
# tests use node:test from the standard library.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Run the test suite
        run: npm test

      - name: Verify every source file parses
        run: |
          for f in src/*.js; do
            node --check "$f" || exit 1
          done
          echo "all source files parse"

  syntax:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check every module parses
        run: |
          for f in src/*.js tests/*.mjs; do
            node --check "$f" || exit 1
          done
          echo "all modules parse"

  package:
    name: Package surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Every shipped file is importable
        # A file present in `files` but absent from `exports` is published yet
        # unreachable — an integrator following the docs hits
        # ERR_PACKAGE_PATH_NOT_EXPORTED, and a workaround can fail SILENTLY
        # (the read-along stylesheet produced a no-paint with no error). This
        # job makes that class impossible to ship.
        run: python3 scripts/audit-exports.py

      - name: The shipped types compile and catch misuse
        run: |
          # TypeScript goes in the CONSUMER directory, not the repo. The first
          # version installed it in the repo and then ran `npx tsc` from /tmp,
          # where nothing was installed — npx refused and the job failed for
          # five days. A check that fails for its own reasons is worse than no
          # check: it trains you to ignore red.
          rm -rf /tmp/pkgtest && mkdir -p /tmp/pkgtest && cd /tmp/pkgtest
          npm init -y >/dev/null
          npm install typescript@5 --silent
          npm install "$GITHUB_WORKSPACE" --silent

          # POSITIVE: correct usage against the published surface must compile.
          cat > consumer.ts <<'TS'
          import { DwellEngine, SignalBridge, ExternalSource, ActivationDetector,
                   AccessOutcomeCounter, classifyActivation, OUTCOMES, DENOMINATORS,
                   type ConsentGate, type CalibrationResult, type MeasureReport,
                   type Witness } from 'access-input';
          const gate: ConsentGate = { isGranted: () => true };
          const dwell = new DwellEngine({ dwellMs: 600, leaveToRearm: true });
          new SignalBridge({ source: new ExternalSource(), dwell, consent: gate });
          dwell.setRepeatTargets({ 'volume-up': 400 });
          const r: CalibrationResult = new ActivationDetector().calibrate(1, 0.1, 10);
          void r;

          // The measurement surface: the number must never be an unchecked fact.
          const c = new AccessOutcomeCounter({ sessionId: 'day-1' });
          c.armed(0);
          const w: Witness = 'undone';
          c.activation({ tMs: 1000, heldMs: 120, witness: w, undoAtMs: 1200 });
          c.disarm(3600000, { activeMs: 120000 });
          const rep: MeasureReport = c.report({ denominator: DENOMINATORS.ACTIVE });
          const perHour: number | null = rep.falsePerHour;
          void [perHour, rep.witnessed, classifyActivation({ tMs: 0 }).basis, OUTCOMES.TRUE];
          TS
          ./node_modules/.bin/tsc --noEmit --strict --target es2022             --module esnext --moduleResolution bundler consumer.ts

          # NEGATIVE: the types must REJECT misuse. Types that only permit
          # correct code are decoration — they document intent without
          # enforcing it, and an integrator gets no protection from them.
          cat > misuse.ts <<'TS'
          import { DwellEngine, AccessOutcomeCounter, classifyActivation } from 'access-input';
          new DwellEngine({ dwellMs: 'fast' });      // wrong type
          new DwellEngine({ dwelllMs: 600 });        // typo'd option
          const d = new DwellEngine();
          d.enter('w1');                             // missing argument

          // The measurement surface must reject misuse too. A rate that is
          // number|null but typed as number would let an integrator compare an
          // unmeasured device as if it scored zero.
          const c = new AccessOutcomeCounter();
          c.activation({ witness: 'maybe' });                     // not a Witness
          c.report({ denominator: 'hourly' });                    // not a denominator
          classifyActivation({ tMs: 0 }, { intentionalHoldMs: '400' });
          const bad: string = c.report().falsePerHour!;           // number|null
          void bad;
          TS
          if ./node_modules/.bin/tsc --noEmit --strict --target es2022                --module esnext --moduleResolution bundler misuse.ts 2>/dev/null; then
            echo "FAIL: misuse compiled — the types do not enforce the API"
            exit 1
          fi
          echo "ok: correct usage compiles, misuse is rejected"


  demo:
    name: Demo loads
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Serve the demo and fetch every module it imports
        run: |
          python3 -m http.server 8795 --bind 127.0.0.1 &
          sleep 2
          # The demo page and each module it loads must be reachable, or the
          # live demo link in the README is broken for visitors.
          for path in /demo/ /src/index.js /src/dwell.js /src/sources.js /src/words.js /src/read-along.js; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:8795$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || exit 1
          done
          echo "demo and all modules load"
